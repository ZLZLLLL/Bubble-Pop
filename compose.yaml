services:
  game:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-5188}:5188"
    environment:
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - game-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5188/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  game-data:
